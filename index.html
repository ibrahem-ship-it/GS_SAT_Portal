<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 LED Controller</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MQTT.js for WebSockets connection to the broker -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        /* Smooth transitions for interactive elements */
        .btn-transition {
            transition: all 0.2s ease-in-out;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4 font-sans text-gray-800">

    <div class="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">ESP32 Controller</h1>
            <p class="text-sm text-gray-500">Control your 38-pin ESP32 internal LED over the web using MQTT.</p>
        </div>

        <!-- Connection Status -->
        <div class="flex items-center justify-center mb-8 bg-gray-50 rounded-lg p-3">
            <div id="statusIndicator" class="w-3 h-3 rounded-full bg-red-500 mr-2 animate-pulse"></div>
            <span id="statusText" class="text-sm font-medium text-gray-600">Disconnected</span>
        </div>

        <!-- Control Buttons -->
        <div class="flex flex-col space-y-4">
            <button id="btnOn" disabled onclick="turnOnLED()" class="btn-transition opacity-50 cursor-not-allowed bg-green-500 hover:bg-green-600 text-white font-bold py-4 px-6 rounded-xl shadow-md hover:shadow-lg flex items-center justify-center text-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
                Turn LED ON
            </button>
            
            <button id="btnOff" disabled onclick="turnOffLED()" class="btn-transition opacity-50 cursor-not-allowed bg-red-500 hover:bg-red-600 text-white font-bold py-4 px-6 rounded-xl shadow-md hover:shadow-lg flex items-center justify-center text-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z" />
                </svg>
                Turn LED OFF
            </button>
        </div>

        <div class="mt-8 pt-4 border-t border-gray-200 text-xs text-gray-400 text-center">
            Topic: <span class="font-mono bg-gray-100 px-1 py-0.5 rounded">my_esp32_38pin/led_control</span>
        </div>
    </div>

    <script>
        // MUST match the exact topic used in the Arduino ESP32 code!
        const MQTT_TOPIC = "my_esp32_38pin/led_control";
        
        // Use EMQX public broker over Secure WebSockets (Port 8084)
        const MQTT_BROKER_URL = "wss://broker.emqx.io:8084/mqtt";
        
        // Generate a random client ID for the web browser
        const clientId = 'web-client-' + Math.random().toString(16).substr(2, 8);
        
        // UI Elements
        const statusIndicator = document.getElementById('statusIndicator');
        const statusText = document.getElementById('statusText');
        const btnOn = document.getElementById('btnOn');
        const btnOff = document.getElementById('btnOff');

        let mqttClient;

        // Initialize MQTT Connection
        function connectMQTT() {
            statusText.innerText = "Connecting...";
            statusIndicator.classList.replace('bg-red-500', 'bg-yellow-400');

            // Connect to the broker
            mqttClient = mqtt.connect(MQTT_BROKER_URL, {
                clientId: clientId,
                clean: true,
                connectTimeout: 4000,
                reconnectPeriod: 1000,
            });

            // Handle successful connection
            mqttClient.on('connect', () => {
                console.log("Connected to MQTT Broker!");
                
                // Update UI visually
                statusIndicator.classList.replace('bg-yellow-400', 'bg-green-500');
                statusIndicator.classList.remove('animate-pulse');
                statusText.innerText = "Connected to Broker";
                statusText.classList.replace('text-gray-600', 'text-green-600');

                // Enable the buttons
                enableButtons();
            });

            // Handle connection errors or offline state
            mqttClient.on('error', (error) => {
                console.error("MQTT Error:", error);
                handleDisconnect();
            });

            mqttClient.on('offline', () => {
                console.log("MQTT Client Offline");
                handleDisconnect();
            });
        }

        function handleDisconnect() {
            statusIndicator.classList.remove('bg-green-500', 'bg-yellow-400');
            statusIndicator.classList.add('bg-red-500', 'animate-pulse');
            statusText.innerText = "Disconnected / Reconnecting...";
            statusText.classList.replace('text-green-600', 'text-gray-600');
            disableButtons();
        }

        function enableButtons() {
            btnOn.disabled = false;
            btnOff.disabled = false;
            btnOn.classList.remove('opacity-50', 'cursor-not-allowed');
            btnOff.classList.remove('opacity-50', 'cursor-not-allowed');
        }

        function disableButtons() {
            btnOn.disabled = true;
            btnOff.disabled = true;
            btnOn.classList.add('opacity-50', 'cursor-not-allowed');
            btnOff.classList.add('opacity-50', 'cursor-not-allowed');
        }

        // Functions to send payloads to the ESP32
        function turnOnLED() {
            if (mqttClient && mqttClient.connected) {
                // Publish the string "ON" to the topic
                mqttClient.publish(MQTT_TOPIC, "ON");
                console.log("Published: ON");
            }
        }

        function turnOffLED() {
            if (mqttClient && mqttClient.connected) {
                // Publish the string "OFF" to the topic
                mqttClient.publish(MQTT_TOPIC, "OFF");
                console.log("Published: OFF");
            }
        }

        // Start the connection when the page loads
        window.onload = connectMQTT;
    </script>
</body>
</html>
