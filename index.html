<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>San3a Tech IoT Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- استبدال مكتبة paho بمكتبة MQTT.js الحديثة -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Custom Animations and Styling for a Premium Look */
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Orbitron:wght@500;700&display=swap');

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .cyber-font {
            font-family: 'Orbitron', sans-serif;
        }

        /* Glassmorphism Panel */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* Animated Background Elements */
        .blob {
            position: absolute;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.6;
            animation: moveBlob 20s infinite alternate;
        }

        @keyframes moveBlob {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(100px, 150px) scale(1.2); }
            100% { transform: translate(-100px, -50px) scale(0.9); }
        }

        /* Status Indicator Glow */
        .glow-active {
            box-shadow: 0 0 20px #00ffcc, inset 0 0 10px #00ffcc;
            border-color: #00ffcc;
        }
        
        .glow-inactive {
            box-shadow: 0 0 10px #ff3366, inset 0 0 5px #ff3366;
            border-color: #ff3366;
        }

        /* Custom Toggle Switch */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #00ffcc;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #00ffcc;
        }

        /* Water Level Animation */
        .water-wave {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 200%;
            height: 100%;
            background: rgba(0, 255, 204, 0.3);
            border-radius: 40%;
            transform-origin: 50% 50%;
            animation: wave 5s infinite linear;
            transition: top 1s ease-in-out;
        }

        @keyframes wave {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Connecting Overlay */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s;
        }
    </style>
</head>
<body class="relative flex flex-col items-center justify-center p-4">
    
    <!-- Background Decor -->
    <div class="blob bg-cyan-500 w-96 h-96 rounded-full top-0 left-0"></div>
    <div class="blob bg-purple-500 w-96 h-96 rounded-full bottom-0 right-0" style="animation-delay: -10s;"></div>

    <!-- Connection Overlay -->
    <div id="overlay">
        <i class="fas fa-satellite-dish text-6xl text-cyan-400 mb-4 animate-pulse"></i>
        <h2 class="text-2xl cyber-font tracking-widest text-cyan-400">Connecting to HiveMQ...</h2>
        <p id="connection-error" class="text-red-500 mt-2 hidden text-sm">Failed to connect. Retrying...</p>
    </div>

    <!-- Main Container -->
    <div class="w-full max-w-4xl z-10 space-y-8">
        
        <!-- Header -->
        <header class="text-center py-6">
            <h1 class="text-5xl md:text-6xl font-bold cyber-font tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-blue-500 mb-2">
                San3a Tech
            </h1>
            <p class="text-gray-300 tracking-widest uppercase text-sm">Smart Agriculture Control Center</p>
        </header>

        <!-- Dashboard Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <!-- Sensor Panel (Left) -->
            <div class="glass-panel p-6 flex flex-col items-center justify-between h-80 relative overflow-hidden group">
                <div class="z-10 text-center w-full">
                    <h2 class="text-xl font-bold text-gray-200 mb-4 flex items-center justify-center gap-2">
                        <i class="fas fa-seedling text-green-400"></i> Soil Moisture
                    </h2>
                    
                    <!-- Circular Progress/Display -->
                    <div class="relative w-40 h-40 mx-auto rounded-full border-4 border-gray-700 flex items-center justify-center overflow-hidden bg-gray-800 shadow-inner">
                        <!-- Animated Water Background -->
                        <div id="water-level" class="water-wave" style="top: 100%;"></div>
                        <div class="z-10 text-center">
                            <span id="moisture-value" class="text-4xl cyber-font font-bold text-white">0%</span>
                            <div id="moisture-status" class="text-xs text-gray-400 mt-1 uppercase">Dry</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Control Panel (Right) -->
            <div class="glass-panel p-6 flex flex-col h-80">
                <h2 class="text-xl font-bold text-gray-200 mb-6 flex items-center gap-2">
                    <i class="fas fa-sliders-h text-cyan-400"></i> System Controls
                </h2>

                <div class="flex-1 flex flex-col justify-around">
                    
                    <!-- Mode Switch -->
                    <div class="flex items-center justify-between bg-black/20 p-4 rounded-xl border border-white/5">
                        <div class="flex items-center gap-3">
                            <i class="fas fa-microchip text-purple-400 text-xl"></i>
                            <div>
                                <h3 class="font-bold text-gray-200">System Mode</h3>
                                <p id="mode-text" class="text-xs text-gray-400">Manual Control</p>
                            </div>
                        </div>
                        
                        <div class="relative inline-block w-16 h-8 align-middle select-none transition duration-200 ease-in">
                            <input type="checkbox" name="toggle" id="mode-toggle" class="toggle-checkbox absolute block w-8 h-8 rounded-full bg-white border-4 appearance-none cursor-pointer transition-all duration-300 top-0 left-0" onchange="toggleMode()"/>
                            <label for="mode-toggle" class="toggle-label block overflow-hidden h-8 rounded-full bg-gray-600 cursor-pointer transition-colors duration-300"></label>
                        </div>
                    </div>

                    <!-- LED Control -->
                    <div id="led-control-container" class="flex flex-col items-center gap-4 p-4 rounded-xl border border-white/5 bg-black/20 transition-all duration-300">
                        <div class="w-full flex justify-between items-center mb-2">
                            <span class="text-gray-200 font-bold"><i class="fas fa-lightbulb text-yellow-400 mr-2"></i>Pump/LED</span>
                            <span id="led-status-indicator" class="px-3 py-1 rounded-full text-xs font-bold bg-red-500/20 text-red-400 border border-red-500/50">OFF</span>
                        </div>
                        
                        <div class="flex gap-4 w-full">
                            <button id="btn-on" onclick="controlLED('on')" class="flex-1 py-3 rounded-lg bg-gray-700 hover:bg-cyan-600 border border-gray-600 hover:border-cyan-400 text-white font-bold transition-all shadow-lg active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
                                TURN ON
                            </button>
                            <button id="btn-off" onclick="controlLED('off')" class="flex-1 py-3 rounded-lg bg-gray-700 hover:bg-red-600 border border-gray-600 hover:border-red-400 text-white font-bold transition-all shadow-lg active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
                                TURN OFF
                            </button>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <!-- Connection Status Footer -->
        <footer class="text-center text-xs text-gray-400 py-4 flex justify-center items-center gap-2">
            <span id="connection-dot" class="w-2 h-2 rounded-full bg-red-500 inline-block"></span>
            Broker: broker.hivemq.com | Built for San3a Tech
        </footer>

    </div>

    <script>
        // --- MQTT Configuration ---
        // استخدام الرابط الآمن لمكتبة MQTT.js
        const brokerUrl = "wss://broker.hivemq.com:8884/mqtt";
        const client_id = "web-client-" + Math.random().toString(16).substr(2, 8);

        // Topics (Must match ESP32 code)
        const TOPIC_LED_CONTROL = "san3atech/iot/led/control";
        const TOPIC_LED_STATUS = "san3atech/iot/led/status";
        const TOPIC_SOIL_DATA = "san3atech/iot/soil/data";
        const TOPIC_MODE_CONTROL = "san3atech/iot/mode";

        // Global Variables
        let mqttClient;
        let isAuto = false;

        // --- DOM Elements ---
        const overlay = document.getElementById('overlay');
        const connectionError = document.getElementById('connection-error');
        const connDot = document.getElementById('connection-dot');
        const moistureValue = document.getElementById('moisture-value');
        const moistureStatus = document.getElementById('moisture-status');
        const waterLevel = document.getElementById('water-level');
        const modeToggle = document.getElementById('mode-toggle');
        const modeText = document.getElementById('mode-text');
        const btnOn = document.getElementById('btn-on');
        const btnOff = document.getElementById('btn-off');
        const ledStatusIndicator = document.getElementById('led-status-indicator');
        const ledControlContainer = document.getElementById('led-control-container');

        // --- Initialize Connection ---
        function initMQTT() {
            console.log("Attempting to connect to HiveMQ via MQTT.js...");
            
            const options = {
                clientId: client_id,
                keepalive: 60,
                clean: true,
                reconnectPeriod: 3000, // إعادة الاتصال تلقائيا كل 3 ثواني
                connectTimeout: 10000,
            };

            // بدء الاتصال
            mqttClient = mqtt.connect(brokerUrl, options);

            mqttClient.on('connect', function () {
                console.log("Connected to HiveMQ MQTT Broker!");
                
                // إخفاء شاشة التحميل
                overlay.style.opacity = '0';
                setTimeout(() => overlay.style.display = 'none', 500);
                connectionError.classList.add('hidden');
                
                // تحديث واجهة المستخدم
                connDot.classList.replace('bg-red-500', 'bg-green-500');
                connDot.classList.add('shadow-[0_0_8px_#22c55e]');

                // الاشتراك في الـ Topics
                mqttClient.subscribe(TOPIC_SOIL_DATA);
                mqttClient.subscribe(TOPIC_LED_STATUS);
                
                // إرسال حالة النظام الحالية (Auto/Manual)
                publishMessage(TOPIC_MODE_CONTROL, isAuto ? "auto" : "manual");
            });

            mqttClient.on('reconnect', function () {
                console.log("Reconnecting to broker...");
                overlay.style.display = 'flex';
                setTimeout(() => overlay.style.opacity = '1', 10);
                connectionError.classList.remove('hidden');
                connectionError.innerText = "Reconnecting to broker...";
                
                connDot.classList.replace('bg-green-500', 'bg-red-500');
                connDot.classList.remove('shadow-[0_0_8px_#22c55e]');
            });

            mqttClient.on('error', function (err) {
                console.error("Connection error: ", err);
                connectionError.innerText = "Connection Error: " + err.message;
                connectionError.classList.remove('hidden');
            });

            mqttClient.on('offline', function () {
                console.log("Client went offline");
            });

            mqttClient.on('message', function (topic, message) {
                // تحويل الرسالة لنص
                const payload = message.toString();
                console.log(`Message arrived: [${topic}] ${payload}`);

                if (topic === TOPIC_SOIL_DATA) {
                    updateSoilData(parseInt(payload));
                } else if (topic === TOPIC_LED_STATUS) {
                    updateLEDStatusUI(payload);
                }
            });
        }

        function updateSoilData(moisture) {
            // Update Text
            moistureValue.innerText = moisture + "%";
            
            // Animate Water Level
            let topPosition = 100 - moisture;
            if(topPosition < 0) topPosition = 0;
            if(topPosition > 100) topPosition = 100;
            
            waterLevel.style.top = topPosition + "%";

            // Update Status Text and Color based on threshold
            if (moisture < 30) {
                moistureStatus.innerText = "Dry - Needs Water";
                moistureValue.className = "text-4xl cyber-font font-bold text-red-400 transition-colors";
                waterLevel.style.background = "rgba(239, 68, 68, 0.4)"; // Reddish water
            } else if (moisture > 70) {
                moistureStatus.innerText = "Overwatered";
                moistureValue.className = "text-4xl cyber-font font-bold text-blue-400 transition-colors";
                waterLevel.style.background = "rgba(59, 130, 246, 0.4)"; // Blue water
            } else {
                moistureStatus.innerText = "Optimal";
                moistureValue.className = "text-4xl cyber-font font-bold text-green-400 transition-colors";
                waterLevel.style.background = "rgba(0, 255, 204, 0.4)"; // Cyan water
            }
        }

        function updateLEDStatusUI(status) {
            if (status === "on") {
                ledStatusIndicator.innerText = "ACTIVE";
                ledStatusIndicator.className = "px-3 py-1 rounded-full text-xs font-bold bg-cyan-500/20 text-cyan-400 border border-cyan-500/50 glow-active";
                btnOn.classList.add('bg-cyan-600', 'border-cyan-400');
                btnOff.classList.remove('bg-red-600', 'border-red-400');
            } else {
                ledStatusIndicator.innerText = "INACTIVE";
                ledStatusIndicator.className = "px-3 py-1 rounded-full text-xs font-bold bg-gray-500/20 text-gray-400 border border-gray-500/50";
                btnOn.classList.remove('bg-cyan-600', 'border-cyan-400');
            }
        }

        function toggleMode() {
            isAuto = modeToggle.checked;
            
            if (isAuto) {
                modeText.innerText = "Automatic Control";
                modeText.classList.replace('text-gray-400', 'text-cyan-400');
                // Disable manual buttons
                btnOn.disabled = true;
                btnOff.disabled = true;
                ledControlContainer.classList.add('opacity-50');
                publishMessage(TOPIC_MODE_CONTROL, "auto");
            } else {
                modeText.innerText = "Manual Control";
                modeText.classList.replace('text-cyan-400', 'text-gray-400');
                // Enable manual buttons
                btnOn.disabled = false;
                btnOff.disabled = false;
                ledControlContainer.classList.remove('opacity-50');
                publishMessage(TOPIC_MODE_CONTROL, "manual");
            }
        }

        function controlLED(action) {
            if (isAuto) return; // Prevent manual control in auto mode
            
            // Add a little click animation class
            const btn = action === 'on' ? btnOn : btnOff;
            btn.classList.add('scale-95');
            setTimeout(() => btn.classList.remove('scale-95'), 150);

            publishMessage(TOPIC_LED_CONTROL, action);
        }

        function publishMessage(topic, payload) {
            if (mqttClient && mqttClient.connected) {
                mqttClient.publish(topic, payload);
                console.log(`Published: [${topic}] ${payload}`);
            } else {
                console.warn("Cannot publish. Not connected to MQTT broker.");
            }
        }

        // Start connection process when page loads
        window.addEventListener('load', initMQTT);

    </script>
</body>
</html>
