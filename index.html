<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المحطة الأرضية - مشروع الماجستير</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts (Cairo for Arabic) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Cairo', 'sans-serif'],
                    },
                    colors: {
                        space: {
                            900: '#0b0f19',
                            800: '#111827',
                            700: '#1f2937',
                        },
                        accent: {
                            500: '#06b6d4', // Cyan
                            400: '#22d3ee',
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #0b0f19;
            background-image: radial-gradient(circle at 50% 0%, #1f2937 0%, transparent 70%);
            color: #f3f4f6;
            min-height: 100vh;
        }
        
        .glass-panel {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .hover-glow:hover {
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.5);
            border-color: rgba(6, 182, 212, 0.8);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #111827; 
        }
        ::-webkit-scrollbar-thumb {
            background: #374151; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #06b6d4; 
        }

        /* Loader */
        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #06b6d4;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="antialiased flex flex-col">

    <header class="glass-panel sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3 text-accent-400">
                <i class="fa-solid fa-satellite-dish text-3xl"></i>
                <div>
                    <h1 class="text-xl font-bold tracking-wider">المحطة الأرضية المركزية</h1>
                    <p class="text-xs text-gray-400">نظام إدارة المهام والبيانات (Master's Project)</p>
                </div>
            </div>
            <div>
                <button id="adminLoginBtn" class="text-sm bg-space-700 hover:bg-space-800 border border-gray-600 px-4 py-2 rounded-lg transition-colors flex items-center gap-2">
                    <i class="fa-solid fa-lock"></i>
                    <span>إدارة الروابط</span>
                </button>
                <button id="adminLogoutBtn" class="hidden text-sm bg-red-900 hover:bg-red-800 border border-red-700 text-white px-4 py-2 rounded-lg transition-colors flex items-center gap-2">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    <span>خروج من الإدارة</span>
                </button>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8 flex-grow">
        
        <!-- Status Bar -->
        <div class="flex justify-between items-center bg-space-800 rounded-lg p-4 mb-8 border border-gray-700 shadow-inner text-sm">
            <div class="flex items-center gap-2">
                <div class="w-3 h-3 rounded-full bg-green-500 animate-pulse"></div>
                <span id="connectionStatus">جاري الاتصال بقاعدة البيانات...</span>
            </div>
            <div class="text-gray-400" id="lastUpdate">
                آخر تحديث: --
            </div>
        </div>

        <!-- Dashboard Links Grid -->
        <div id="loadingIndicator" class="flex flex-col items-center justify-center py-20 text-gray-400 gap-4">
            <div class="loader"></div>
            <p>جاري تحميل بيانات المشاريع...</p>
        </div>

        <div id="linksGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
            <!-- Cards will be injected here via JS -->
        </div>

        <section id="adminPanel" class="hidden mt-12 pt-8 border-t border-gray-700">
            <h2 class="text-2xl font-bold mb-6 text-accent-400 flex items-center gap-2">
                <i class="fa-solid fa-gear"></i> لوحة تحكم المسؤول
            </h2>
            
            <div class="glass-panel p-6 rounded-xl">
                <h3 class="text-lg font-semibold mb-4">إضافة أداة / رابط جديد</h3>
                <form id="addLinkForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">اسم الأداة / المشروع</label>
                        <input type="text" id="linkTitle" required class="w-full bg-space-900 border border-gray-600 rounded-lg p-2 text-white focus:outline-none focus:border-accent-500" placeholder="مثال: صور الدرون">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">الرابط (URL)</label>
                        <input type="url" id="linkUrl" required class="w-full bg-space-900 border border-gray-600 rounded-lg p-2 text-white focus:outline-none focus:border-accent-500" placeholder="https://...">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm text-gray-400 mb-1">وصف قصير</label>
                        <input type="text" id="linkDesc" required class="w-full bg-space-900 border border-gray-600 rounded-lg p-2 text-white focus:outline-none focus:border-accent-500" placeholder="وصف لما يفعله هذا الرابط...">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">رمز الأيقونة (FontAwesome)</label>
                        <select id="linkIcon" class="w-full bg-space-900 border border-gray-600 rounded-lg p-2 text-white focus:outline-none focus:border-accent-500">
                            <option value="fa-satellite">قمر صناعي (Satellite)</option>
                            <option value="fa-plane-up">درون (Drone)</option>
                            <option value="fa-satellite-dish">محطة أرضية (Ground Station)</option>
                            <option value="fa-database">قاعدة بيانات (Database)</option>
                            <option value="fa-chart-line">تحليلات (Analytics)</option>
                            <option value="fa-folder-open">ملفات (Files)</option>
                            <option value="fa-code">برمجيات (Code)</option>
                            <option value="fa-book">رسالة/توثيق (Documentation)</option>
                        </select>
                    </div>
                    <div class="flex items-end">
                        <button type="submit" class="w-full bg-accent-500 hover:bg-accent-400 text-space-900 font-bold py-2 px-4 rounded-lg transition-colors flex items-center justify-center gap-2">
                            <i class="fa-solid fa-plus"></i> إضافة الرابط
                        </button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <!-- Custom Alert Modal -->
    <div id="customAlert" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-[100] hidden backdrop-blur-sm">
        <div class="bg-space-800 border border-gray-600 rounded-xl p-6 max-w-sm w-full mx-4 shadow-2xl">
            <h3 id="alertTitle" class="text-xl font-bold mb-2 text-accent-400">تنبيه</h3>
            <p id="alertMessage" class="text-gray-300 mb-6">الرسالة هنا</p>
            <div class="flex justify-end">
                <button onclick="closeAlert()" class="bg-space-700 hover:bg-space-600 border border-gray-500 px-4 py-2 rounded-lg transition-colors">موافق</button>
            </div>
        </div>
    </div>

    <!-- Login Modal -->
    <div id="loginModal" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-[100] hidden backdrop-blur-sm">
        <div class="glass-panel p-6 rounded-xl max-w-sm w-full mx-4 shadow-2xl">
            <h3 class="text-xl font-bold mb-4 text-accent-400 flex items-center gap-2">
                <i class="fa-solid fa-shield-halved"></i> تسجيل دخول الإدارة
            </h3>
            <p class="text-sm text-gray-400 mb-4">أدخل كلمة المرور الخاصة بفريق العمل لتعديل الروابط.</p>
            <input type="password" id="adminPassword" class="w-full bg-space-900 border border-gray-600 rounded-lg p-2 text-white focus:outline-none focus:border-accent-500 mb-4" placeholder="كلمة المرور (جرب: admin123)">
            <div class="flex justify-end gap-2">
                <button onclick="closeLoginModal()" class="bg-transparent hover:bg-space-800 text-gray-300 px-4 py-2 rounded-lg transition-colors">إلغاء</button>
                <button onclick="verifyLogin()" class="bg-accent-500 hover:bg-accent-400 text-space-900 font-bold px-4 py-2 rounded-lg transition-colors">دخول</button>
            </div>
        </div>
    </div>

    <script type="module">
        // Firebase Imports
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global Setup
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'master-thesis-dashboard';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            // Mock config fallback for local testing if needed
        };
        const initialToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        let app, db, auth;
        let currentUser = null;
        let isAdmin = false; // Simple client-side admin toggle

        // DOM Elements
        const linksGrid = document.getElementById('linksGrid');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const connectionStatus = document.getElementById('connectionStatus');
        const lastUpdate = document.getElementById('lastUpdate');
        const adminPanel = document.getElementById('adminPanel');
        const adminLoginBtn = document.getElementById('adminLoginBtn');
        const adminLogoutBtn = document.getElementById('adminLogoutBtn');
        const addLinkForm = document.getElementById('addLinkForm');

        // Custom Alert Functions
        window.showAlert = (title, message) => {
            document.getElementById('alertTitle').textContent = title;
            document.getElementById('alertMessage').textContent = message;
            document.getElementById('customAlert').classList.remove('hidden');
        };
        window.closeAlert = () => {
            document.getElementById('customAlert').classList.add('hidden');
        };

        // Login Modal Functions
        window.openLoginModal = () => {
            document.getElementById('loginModal').classList.remove('hidden');
            document.getElementById('adminPassword').value = '';
            document.getElementById('adminPassword').focus();
        };
        window.closeLoginModal = () => {
            document.getElementById('loginModal').classList.add('hidden');
        };
        window.verifyLogin = () => {
            const pass = document.getElementById('adminPassword').value;
            // Simple password for the team - can be changed
            if (pass === 'admin123') {
                isAdmin = true;
                closeLoginModal();
                updateUIRole();
                showAlert('تم بنجاح', 'تم تفعيل وضع الإدارة، يمكنك الآن تعديل الروابط.');
            } else {
                showAlert('خطأ', 'كلمة المرور غير صحيحة.');
            }
        };

        async function initApp() {
            try {
                if(Object.keys(firebaseConfig).length === 0) {
                    throw new Error("Missing Firebase Config");
                }

                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                // Auth flow
                if (initialToken) {
                    await signInWithCustomToken(auth, initialToken);
                } else {
                    await signInAnonymously(auth);
                }

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        currentUser = user;
                        connectionStatus.textContent = 'متصل بقاعدة البيانات';
                        connectionStatus.classList.replace('text-gray-400', 'text-green-400');
                        fetchLinks();
                    } else {
                        currentUser = null;
                        connectionStatus.textContent = 'غير متصل';
                        connectionStatus.classList.replace('text-green-400', 'text-red-500');
                    }
                });

            } catch (error) {
                console.error("Firebase Init Error:", error);
                connectionStatus.textContent = 'فشل الاتصال';
                connectionStatus.classList.replace('text-green-400', 'text-red-500');
                showAlert('خطأ في النظام', 'لم نتمكن من الاتصال بقاعدة البيانات. تأكد من إعدادات الشبكة.');
            }
        }

        function getCollectionRef() {
            // CRITICAL RULE 1: Use specific path structure
            return collection(db, 'artifacts', appId, 'public', 'data', 'project_links');
        }

        function fetchLinks() {
            if (!currentUser) return;
            
            const q = query(getCollectionRef());
            
            // Listen for realtime updates
            onSnapshot(q, (snapshot) => {
                loadingIndicator.classList.add('hidden');
                linksGrid.classList.remove('hidden');
                
                // CRITICAL RULE 2: Sort in memory, not using orderBy
                const links = [];
                snapshot.forEach(doc => {
                    links.push({ id: doc.id, ...doc.data() });
                });
                
                // Sort by creation time (fallback to 0 if missing)
                links.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                
                renderLinks(links);
                
                const now = new Date();
                lastUpdate.textContent = `آخر تحديث: ${now.getHours()}:${now.getMinutes().toString().padStart(2, '0')}`;
            }, (error) => {
                console.error("Error fetching links: ", error);
                showAlert('خطأ', 'حدث خطأ أثناء جلب الروابط.');
            });
        }

        window.deleteLink = async (id) => {
            if (!currentUser || !isAdmin) return;
            // Since we can't use confirm(), we'll just delete it for simplicity in this demo,
            // or we could implement a custom confirm modal. We'll proceed with direct delete.
            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'project_links', id);
                await deleteDoc(docRef);
                // Notification via UI not alert
                const statusMsg = document.createElement('div');
                statusMsg.className = 'fixed bottom-4 left-4 bg-green-600 text-white px-4 py-2 rounded shadow-lg z-50';
                statusMsg.textContent = 'تم الحذف بنجاح';
                document.body.appendChild(statusMsg);
                setTimeout(() => statusMsg.remove(), 3000);
            } catch (error) {
                console.error("Error deleting link:", error);
                showAlert('خطأ', 'فشل في حذف الرابط.');
            }
        };

        function renderLinks(links) {
            linksGrid.innerHTML = '';
            
            if (links.length === 0) {
                linksGrid.innerHTML = `
                    <div class="col-span-full flex flex-col items-center justify-center py-12 text-gray-500 glass-panel rounded-xl">
                        <i class="fa-solid fa-satellite text-4xl mb-4 opacity-50"></i>
                        <p>لا توجد روابط مضافة بعد. استخدم الإدارة لإضافة أدوات المشروع.</p>
                    </div>
                `;
                return;
            }

            links.forEach(link => {
                const card = document.createElement('div');
                card.className = 'glass-panel rounded-xl p-6 transition-all duration-300 hover-glow group relative flex flex-col h-full';
                
                // Delete button (only visible if admin)
                const deleteBtnHtml = isAdmin ? `
                    <button onclick="deleteLink('${link.id}')" class="absolute top-4 left-4 text-gray-500 hover:text-red-500 transition-colors" title="حذف">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                ` : '';

                card.innerHTML = `
                    ${deleteBtnHtml}
                    <div class="w-12 h-12 bg-space-800 rounded-lg flex items-center justify-center border border-gray-600 text-accent-400 mb-4 group-hover:scale-110 transition-transform">
                        <i class="fa-solid ${link.icon} text-2xl"></i>
                    </div>
                    <h3 class="text-xl font-bold mb-2 text-white">${link.title}</h3>
                    <p class="text-gray-400 text-sm mb-6 flex-grow">${link.description}</p>
                    
                    <a href="${link.url}" target="_blank" class="w-full block text-center bg-space-700 hover:bg-accent-500 hover:text-space-900 text-white border border-gray-600 font-semibold py-2 px-4 rounded-lg transition-colors mt-auto">
                        فتح الرابط <i class="fa-solid fa-arrow-up-right-from-square text-xs ml-1"></i>
                    </a>
                `;
                linksGrid.appendChild(card);
            });
        }

        function updateUIRole() {
            if (isAdmin) {
                adminPanel.classList.remove('hidden');
                adminLoginBtn.classList.add('hidden');
                adminLogoutBtn.classList.remove('hidden');
            } else {
                adminPanel.classList.add('hidden');
                adminLoginBtn.classList.remove('hidden');
                adminLogoutBtn.classList.add('hidden');
            }
            // Re-render links to show/hide delete buttons
            fetchLinks(); 
        }

        // Event Listeners
        adminLoginBtn.addEventListener('click', openLoginModal);
        
        adminLogoutBtn.addEventListener('click', () => {
            isAdmin = false;
            updateUIRole();
            showAlert('تسجيل خروج', 'تم الخروج من وضع الإدارة بنجاح.');
        });

        addLinkForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser || !isAdmin) return;

            const title = document.getElementById('linkTitle').value;
            const url = document.getElementById('linkUrl').value;
            const description = document.getElementById('linkDesc').value;
            const icon = document.getElementById('linkIcon').value;
            const submitBtn = e.target.querySelector('button[type="submit"]');

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري الإضافة...';

            try {
                await addDoc(getCollectionRef(), {
                    title,
                    url,
                    description,
                    icon,
                    createdAt: Date.now(),
                    createdBy: currentUser.uid
                });
                
                addLinkForm.reset();
                
                // Success feedback
                submitBtn.innerHTML = '<i class="fa-solid fa-check"></i> تمت الإضافة';
                submitBtn.classList.replace('bg-accent-500', 'bg-green-500');
                
                setTimeout(() => {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fa-solid fa-plus"></i> إضافة الرابط';
                    submitBtn.classList.replace('bg-green-500', 'bg-accent-500');
                }, 2000);

            } catch (error) {
                console.error("Error adding link:", error);
                showAlert('خطأ', 'حدث خطأ أثناء حفظ البيانات.');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-plus"></i> إضافة الرابط';
            }
        });

        // Initialize
        window.addEventListener('DOMContentLoaded', initApp);

    </script>
</body>
</html>
